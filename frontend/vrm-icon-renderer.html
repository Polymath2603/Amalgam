<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.2/lib/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const params = new URLSearchParams(location.search);
const modelUrl = params.get('model') || '/user_data/avatars/avatar.vrm';

const SIZE = 192;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(2);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(18, 1, 0.1, 20);
camera.position.set(0, 1.52, 1.2);
camera.lookAt(0, 1.48, 0);

scene.add(new THREE.DirectionalLight(0xffffff, Math.PI).position.set(1, 1, 1).normalize());
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));

window.__vrmReady = false;

loader.load(modelUrl, (gltf) => {
    console.log('GLTF loaded');
    const vrm = gltf.userData.vrm;
    if (!vrm) { console.error('No VRM data'); window.__vrmError = true; window.__vrmReady = true; return; }
    console.log('VRM data parsed');
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.combineSkeletons(gltf.scene);
    VRMUtils.combineMorphs(vrm);
    console.log('VRM processed');
    // Fix rotation for VRM0 models only
    if (vrm.meta?.metaVersion === '0') {
        vrm.scene.rotation.y = Math.PI;
    }
    gltf.scene.traverse(o => { o.frustumCulled = false; });
    scene.add(vrm.scene);
    console.log('VRM added to scene');

    // Relaxed pose
    const h = vrm.humanoid;
    if (h) {
        const spine = h.getNormalizedBoneNode('spine');
        if (spine) spine.rotation.x = -0.05;
        const lua = h.getNormalizedBoneNode('leftUpperArm');
        const rua = h.getNormalizedBoneNode('rightUpperArm');
        if (lua) lua.rotation.z = 0.3;
        if (rua) rua.rotation.z = -0.3;
    }

    // Portrait camera — compute framing from actual VRM bone positions
    vrm.update(0.01); // Give it a tiny bit of time for initial state
    vrm.scene.updateMatrixWorld(true);

    const headBone = h?.getNormalizedBoneNode('head');
    const neckBone = h?.getNormalizedBoneNode('neck');
    const fov = camera.fov * (Math.PI / 180);

    if (headBone && neckBone) {
        const headPos = new THREE.Vector3();
        const neckPos = new THREE.Vector3();
        headBone.getWorldPosition(headPos);
        neckBone.getWorldPosition(neckPos);

        // Calculate a box around the head area
        // Head top is roughly above head center, head bottom is neck
        const headTop = headPos.y + (headPos.y - neckPos.y) * 1.5;
        const headBottom = neckPos.y;
        const midY = (headTop + headBottom) / 2;
        const headHeight = headTop - headBottom;

        // Determine distance to frame the head height
        const dist = (headHeight * 1.0) / Math.tan(fov / 2);

        // Camera faces front: both VRM0 (rotated by PI) and VRM1 face +Z
        const camOffsetZ = dist;

        camera.position.set(headPos.x, midY, headPos.z + camOffsetZ);
        camera.lookAt(headPos.x, midY, headPos.z);
    } else {
        // Fallback for models with missing head/neck bones
        const box = new THREE.Box3().setFromObject(vrm.scene);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const dist = (size.y * 0.25) / Math.tan(fov / 2);
        const camOffsetZ = dist;
        const fallbackY = box.max.y - size.y * 0.1;
        camera.position.set(center.x, fallbackY, center.z + camOffsetZ);
        camera.lookAt(center.x, fallbackY, center.z);
    }

    // Look at camera
    const target = new THREE.Object3D();
    camera.add(target);
    if (vrm.lookAt) vrm.lookAt.target = target;

    // Set happy expression
    if (vrm.expressionManager) {
        vrm.expressionManager.setValue('happy', 0.6);
    }

    vrm.update(0);
    console.log('Rendering basic view');
    renderer.render(scene, camera);
    console.log('Render complete');
    window.__vrmReady = true;
    }, undefined, (err) => {

    console.error('VRM load error:', err?.message || err);
    window.__vrmError = true;
    window.__vrmReady = true; // Signal done even on error
});
</script>
</body>
</html>
