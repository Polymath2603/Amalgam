<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgam Companion</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
}
#avatar-canvas {
    width: 100%;
    height: 100%;
}
#avatar-canvas canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
}
#disconnected-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 2px; background: #ff5c5c;
    display: none;
}
#status {
    position: fixed; bottom: 4px; right: 4px;
    padding: 1px 6px; border-radius: 3px;
    font-size: 8px; font-weight: 600;
    background: rgba(0,0,0,0.5); color: #aaa;
    pointer-events: none;
}
#status.connected { color: #00e699; }
#status.disconnected { color: #ff5c5c; }
#controls {
    position: fixed;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 2px;
    padding: 2px 4px;
    background: rgba(26,27,36,0.7);
    border-radius: 8px;
    z-index: 200;
    transition: opacity 0.3s;
    opacity: 0;
    pointer-events: none;
}
#controls.visible { opacity: 1; pointer-events: auto; }

/* Companion speech bubble */
.companion-bubble {
    position: fixed;
    left: 50%;
    bottom: 40%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(26, 27, 36, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(125, 108, 241, 0.3);
    border-radius: 16px;
    padding: 12px 18px;
    max-width: 400px;
    color: #e5e7eb;
    font-size: 14px;
    line-height: 1.5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 150;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}
.companion-bubble.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.ctrl-btn {
    width: 24px; height: 24px; border: none;
    border-radius: 4px; background: transparent;
    color: #d1d5db; cursor: pointer;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
}
.ctrl-btn:hover { background: rgba(125,108,241,0.3); }
</style>
</head>
<body>
    <div id="avatar-canvas"></div>
    <div id="disconnected-bar"></div>
    <div id="companion-bubble" class="companion-bubble">
        <div class="bubble-text">Hello!</div>
    </div>
    <div id="status" class="disconnected">disconnected</div>
    <div id="controls" class="visible">
        <button class="ctrl-btn" id="btn-mute" title="Mute mic">🎤</button>
        <button class="ctrl-btn exit" id="btn-close" title="Close">✕</button>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "../webui/vendor/three.module.js",
            "three/addons/": "../webui/vendor/",
            "@pixiv/three-vrm": "../webui/vendor/three-vrm.module.min.js"
        }
    }
    </script>
    <script>
        // Read ws_port from URL query parameter (set by launcher.py)
        const _wsPort = new URLSearchParams(window.location.search).get('ws_port');
    </script>
    <script type="module" src="overlay.js"></script>
</body>
</html>
